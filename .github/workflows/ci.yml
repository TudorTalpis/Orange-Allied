name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend CI plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Future stack: React + Vite + TypeScript + Tailwind CSS + shadcn/ui.
      # These are informative placeholders: frontend files do not exist yet.
      - name: Planned TypeScript type-check
        run: 'echo "Planned frontend check: TypeScript type-check"'

      - name: Planned lint
        run: 'echo "Planned frontend check: lint"'

      - name: Planned Vitest and React Testing Library tests
        run: 'echo "Planned frontend check: Vitest and React Testing Library tests"'

      - name: Planned Vite build
        run: 'echo "Planned frontend check: Vite build"'

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orange_allied
          POSTGRES_PASSWORD: orange_allied
          POSTGRES_DB: orange_allied
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orange_allied"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://orange_allied:orange_allied@localhost:5432/orange_allied
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  database:
    name: Database CI plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Future stack: PostgreSQL + SQL + pgvector.
      - name: Planned PostgreSQL checks
        run: 'echo "Planned database check: PostgreSQL and SQL checks"'

      - name: Planned migrations and integration tests
        run: 'echo "Planned database check: migrations and integration tests"'

      - name: Planned pgvector checks
        run: 'echo "Planned database check: pgvector checks"'

  integration:
    name: Integration CI plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Future DevOps stack: Docker + Docker Compose.
      - name: Planned Docker Compose integration tests
        run: 'echo "Planned integration check: Docker Compose integration tests"'

      - name: Planned end-to-end tests
        run: 'echo "Planned integration check: end-to-end tests"'
